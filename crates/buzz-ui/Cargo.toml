[package]
name = "buzz-ui"
description = "Application shell: theme, menus, panels and stage chrome"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
buzz-geom.workspace = true
buzz-scene.workspace = true
buzz-act.workspace = true
# For the font picker's previews, which outline each family in itself with the
# same call the Text tool draws with.
buzz-text.workspace = true
buzz-rig.workspace = true
buzz-doc.workspace = true
buzz-ai.workspace = true
buzz-export.workspace = true
buzz-render.workspace = true

egui.workspace = true
kurbo.workspace = true
peniko.workspace = true
serde.workspace = true
serde_json.workspace = true
crossbeam-channel.workspace = true
image.workspace = true
rfd = { version = "0.16", default-features = false, features = ["xdg-portal"] }

# The About window's banner is a PNG, decoded when that window first opens.
png = "0.18"
tracing.workspace = true

# The screen colour loupe and the system Colors window (`screen_color`).
# Already in the build through winit; these name the parts of AppKit used.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
block2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = [
    "std",
    "block2",
    "objc2-core-foundation",
    "NSColor",
    "NSColorPanel",
    "NSColorSampler",
    "NSColorSpace",
    "NSPanel",
    "NSResponder",
    "NSWindow",
] }

[dev-dependencies]
tempfile = "3"
