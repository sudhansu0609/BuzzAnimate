[package]
name = "buzz-app"
description = "BuzzAnimate application shell"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[lib]
name = "buzz_app"
path = "src/lib.rs"

[[bin]]
name = "buzzanimate"
path = "src/main.rs"

[dependencies]
buzz-geom.workspace = true
buzz-jobs.workspace = true
buzz-render.workspace = true
buzz-scene.workspace = true
buzz-doc.workspace = true
buzz-ui.workspace = true
buzz-import-xfl.workspace = true
buzz-import-pdf.workspace = true
buzz-import-swf.workspace = true
buzz-script.workspace = true
buzz-export.workspace = true
buzz-rig.workspace = true
buzz-audio.workspace = true

vello.workspace = true
kurbo.workspace = true
peniko.workspace = true
winit.workspace = true

# egui 0.35 is pinned deliberately: 0.36 requires wgpu 30, which vello 0.9
# cannot use. See the note in the workspace manifest.
egui.workspace = true
egui-wgpu.workspace = true
egui-winit.workspace = true

anyhow.workspace = true
thiserror.workspace = true
crossbeam-channel.workspace = true
pollster.workspace = true
rayon.workspace = true
rfd = { version = "0.16", default-features = false, features = ["xdg-portal", "tokio"] }
tracing.workspace = true
tracing-subscriber.workspace = true

# The window icon is decoded at startup from the PNG in `assets/`.
png = "0.18"
# Animate's asset manifests are JSON.
serde_json.workspace = true

# The soundtrack is written out for the video encoder to read, into a directory
# that lives exactly as long as the encode does.
tempfile = "3"

[build-dependencies]
# Embeds the icon into the .exe, so Explorer and the taskbar show it too.
# The build script tolerates its absence rather than failing.
winresource = "0.1"

[dev-dependencies]
tempfile = "3"
hound = "3.5"
zip.workspace = true
swf.workspace = true
