[package]
name = "buzz-script"
description = "JSFL-equivalent scripting: a sandboxed JavaScript API over the document"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
buzz-geom.workspace = true
buzz-scene.workspace = true
# The performance and the director. A script that can stage a scene and
# animate the people in it is the difference between automating a drawing
# and automating a shot.
buzz-act.workspace = true
# For the glyph outlines a text object is made of.
buzz-text.workspace = true
# Dialogue: the clips the host decoded, and the viseme analysis a script runs
# against them. No file IO comes with it — the host opens the file, and the
# script is handed what came out.
buzz-audio.workspace = true
# The asset library on disk -- the one directory a script may write to. See
# `ScriptContext::asset_root`.
buzz-doc.workspace = true

kurbo.workspace = true
# Several of the film-making calls take more arguments than rquickjs will bind
# to a native function (seven), so those take one JSON object instead. It is
# also how they answer with more than one number.
serde_json.workspace = true
peniko.workspace = true
thiserror.workspace = true
tracing.workspace = true

rquickjs = { version = "0.12.2", features = ["classes", "properties"] }

[dev-dependencies]
tempfile = "3"
