[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "MIT OR Apache-2.0"
authors = ["Buzzcaf Media"]
repository = "https://github.com/buzzcaf/buzzanimate"

# ---------------------------------------------------------------------------
# Pinned GPU stack.
#
# vello 0.9 depends on wgpu ^29.0.3 and egui-wgpu 0.35 depends on wgpu ^29.0.
# These MUST resolve to the same wgpu major or the Vello renderer and the egui
# UI end up with structurally distinct `wgpu::Device` types and cannot share a
# surface. egui 0.36 / egui-wgpu 0.36 moved to wgpu 30 and is therefore NOT
# usable until vello also moves to wgpu 30. Do not bump egui past 0.35 alone.
# ---------------------------------------------------------------------------
[workspace.dependencies]
wgpu = "29.0.4"
vello = "0.9.0"
kurbo = { version = "0.13.1", features = ["serde"] }
# `serde` here also turns it on for the `color` crate, so peniko::Color can be
# persisted directly in the .buzz format rather than needing a wrapper type.
peniko = { version = "0.6.1", features = ["serde"] }
winit = "0.30.13"

egui = "0.35.0"
egui-wgpu = "0.35.0"
egui-winit = "0.35.0"
egui_dock = "0.20.1"

i_overlay = "8.0.0"
rayon = "1.12.0"
parking_lot = "0.12.5"
arc-swap = "1.9.2"
crossbeam-channel = "0.5"

anyhow = "1.0.104"
thiserror = "2"
pollster = "1.0.1"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
sysinfo = "0.39.6"
# `rc` lets an `Arc<Gradient>` inside a `Paint` derive Serialize. It does not
# preserve sharing across a round trip, which does not matter here: the `.buzz`
# format is written by the DTO layer in `buzz-doc`, never by these derives.
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
# Bitmap decoding. Default features off: the full crate pulls in a dozen
# formats and their dependencies, and what an animator imports is a PNG, a
# JPEG or the odd GIF or WebP.
image = { version = "0.25", default-features = false, features = [
    "png",
    "jpeg",
    "gif",
    "bmp",
    "webp",
] }

rstar = "0.13.0"
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }
quick-xml = "0.41.0"

# Importers.
#
# lopdf is MIT and pure Rust, which is why it is here rather than
# `pdfium-render`: that would bind a multi-megabyte C++ blob that has to be
# shipped alongside the executable, for an API that is built around
# *rasterising* pages. We want the paths themselves, in `f64`, still editable.
lopdf = { version = "0.44.0", default-features = false }
# Ruffle's SWF reader, MIT OR Apache-2.0. The `swf-parser` crate does the same
# job but is AGPL-3.0, which this project cannot take.
swf = "0.2.2"

# Internal crates
buzz-geom = { path = "crates/buzz-geom" }
buzz-jobs = { path = "crates/buzz-jobs" }
buzz-render = { path = "crates/buzz-render" }
buzz-scene = { path = "crates/buzz-scene" }
buzz-doc = { path = "crates/buzz-doc" }
buzz-ui = { path = "crates/buzz-ui" }
buzz-import-xfl = { path = "crates/buzz-import-xfl" }
buzz-import-pdf = { path = "crates/buzz-import-pdf" }
buzz-import-swf = { path = "crates/buzz-import-swf" }
buzz-script = { path = "crates/buzz-script" }
buzz-export = { path = "crates/buzz-export" }
buzz-rig = { path = "crates/buzz-rig" }
buzz-audio = { path = "crates/buzz-audio" }
buzz-light = { path = "crates/buzz-light" }
buzz-fx = { path = "crates/buzz-fx" }
buzz-act = { path = "crates/buzz-act" }
buzz-physics = { path = "crates/buzz-physics" }

[profile.dev]
opt-level = 1

# Vello and wgpu are unusably slow when compiled without optimisation, even in
# a debug build of BuzzAnimate itself.
[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1
